name: Relay issue comments to the working agent

# Copilot cloud agent only reads an issue's body at assignment time and only
# reacts to `@copilot` mentions on its own pull request afterward (see
# docs/agent-automation.md). New comments left on the issue while the agent is
# still working would otherwise be silently ignored. This workflow watches for
# those comments and, once the agent has opened its pull request, relays them
# there as an `@copilot` mention so the agent picks them up as extra context.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  relay:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.assignees.*.login, 'copilot-swe-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_URL: ${{ github.event.comment.html_url }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Require a user token for the Copilot follow-up mention
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'Add COPILOT_ASSIGNMENT_TOKEN as an Actions secret. See docs/agent-automation.md.' >&2
            exit 1
          fi

      - name: Find the agent's open pull request for this issue
        id: find_pr
        shell: bash
        run: |
          set -euo pipefail
          timeline="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/timeline?per_page=100")"
          pr_number="$(jq -r '
            [.[][] | select(.event == "cross-referenced"
              and (.source.issue.pull_request != null)
              and (.source.issue.state == "open")
              and (.source.issue.user.login == "copilot-swe-agent[bot]"))
            | .source.issue.number] | sort | last // empty
          ' <<<"$timeline")"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Relay the new comment to the pull request
        if: steps.find_pr.outputs.pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          marker="<!-- issue-comment-relay:${COMMENT_ID} -->"

          existing="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq --arg marker "$marker" '[.[][] | select((.body // "") | contains($marker))] | length')"
          if (( existing > 0 )); then
            echo "Comment ${COMMENT_ID} was already relayed to PR #${PR_NUMBER}."
            exit 0
          fi

          comment_file="$RUNNER_TEMP/relayed-issue-comment.md"
          {
            printf '%s\n' "$marker"
            printf 'New comment on the linked issue #%s from @%s: %s\n\n' \
              "$ISSUE_NUMBER" "$COMMENT_AUTHOR" "$COMMENT_URL"
            printf '%s\n\n' "$COMMENT_BODY"
            printf '@copilot Please take the comment above into account while you continue working on this pull request.\n'
          } > "$comment_file"

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"

      - name: Note that no pull request exists yet
        if: steps.find_pr.outputs.pr_number == ''
        shell: bash
        run: |
          echo "No open pull request from copilot-swe-agent[bot] references issue #${ISSUE_NUMBER} yet; nothing to relay the comment to." \
            >> "$GITHUB_STEP_SUMMARY"
